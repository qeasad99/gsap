<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        body {
            height: 2000px;
        }

        div {
            width: 100px;
            height: 100px;
            margin: 50px auto;
        }

        .box1 {
            background-color: lightblue;
            margin-top: 1000px;
        }

        .box2 {
            background-color: lightpink;
        }

        .box3 {
            background-color: lightyellow;
        }
    </style>
</head>

<body>
    <div class="box1">box1</div>
    <div class="box2">box2</div>
    <div class="box3">box3</div>
    <script>
        gsap.to(".box1", {
            rotation: 360,
            duration: 2,
            scrollTrigger: {
                trigger: ".box1",
                start: "0% 60%", //0%는 top
                end: "bottom 30%",
                scrub: 1,
                // markers: true,

            }

        })

        gsap.to(".box2", {
            rotation: 30,
            scale: 1.2,
            duration: 1,
            scrollTrigger: {
                trigger: ".box2",
                start: "top 30%",
                end: "bottom 30%",
                scrub: 2,
                // markers: true,
            }

        })
        gsap.to(".box3", {
            rotation: 170,
            scale: 0.5,
            duration: 2,
            scrollTrigger: {
                trigger: ".box2",
                start: "top 30%",
                end: "bottom 80%",
                scrub: 2,
                markers: true,
            }

        })
    </script>
</body>

</html>
