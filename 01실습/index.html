<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container">
        <section id="con01">
            <h2>section01</h2>
            <ul>
                <li class="card01">card1</li>
                <li class="card02">card2</li>
                <li class="card03">card3</li>
                <li class="card04">card4</li>
                <li class="card05">card5</li>
            </ul>
        </section>
        <section id="con02">
            <h2>section02</h2>
            <ul>
                <li>card1</li>
                <li>card2</li>
                <li>card3</li>
                <li>card4</li>
            </ul>
        </section>

    </div>
    <script>

        gsap.timeline({
            scrollTrigger: {
                trigger: "#con01",
                start: "bottom 80%",
                end: "bottom 20%",
                scrub: 3,
                pin: true,
                // markers: true,
            }
        })
            .fromTo("#con01 .card01",
                { y: 200 },
                { y: 0, opacity: 1 },
            )
            .fromTo("#con01 .card02",
                { y: 200 },
                { y: 0, opacity: 1 }
            )
            .fromTo("#con01 .card03",
                { y: 200 },
                { y: 0, opacity: 1 }
            )
            .fromTo("#con01 .card04",
                { y: 200 },
                { y: 0, opacity: 1 }
            )
            .fromTo("#con01 .card05",
                { y: 200 },
                { y: 0, opacity: 1 }
            );


        gsap.timeline({
            scrollTrigger: {
                trigger: "#con02",
                start: "top top",
                end: "+=5000",
                scrub: 3,
                pin: true,
                markers: true,
            }
        })
            .fromTo("#con02 li:nth-of-type(1)",
                { y: 200 },
                { y: 0, opacity: 1, duration: 1 },
            )
            .fromTo("#con02 li:nth-of-type(2)",
                { y: 200 },
                { y: 0, opacity: 1, duration: 1 }

            )
            .fromTo("#con02 li:nth-of-type(3)",
                { y: 200 },
                { y: 0, opacity: 1, duration: 1 }

            )
            .fromTo("#con02 li:nth-of-type(4)",
                { y: 200 },
                { y: 0, opacity: 1, duration: 1 }

            )
    </script>
</body>

</html>
