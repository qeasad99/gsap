<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <style>
        body {
            height: 3000px;
        }

        .box1 {
            width: 100px;
            height: 100px;
            background-color: tomato;
            margin: 100vh auto 0px;

        }
    </style>
</head>

<body>
    <div class="box1"></div>
    <script>
        gsap.to(".box1", {
            x: 300,
            scale: 2,
            rotate: 170,
            duration: 2,
            scrollTrigger: {
                trigger: ".box1",
                start: "top 50%",
                markers: true,
            }
        });

    </script>

</body>

</html>
<!--
scrollTrigger는 gsap에 플러그인으로 스크롤을 기준으로 애니메이션을 실행시킴
trigger : 애니메이션 요소지정
start,end :스크롤 시작 / 끝("top center","bottom 50%","50% top")
scrub: 스크롤에 맞춰 애니메이션이 진행됨.(숫자가 클수록 부드러워짐 1,2,3)
markers:가이드 표시(true로 설정 시 보임)




-->
