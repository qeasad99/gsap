<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        body {
            height: 3000px;
            width: 100%;
            background-color: antiquewhite;
            text-align: center;

        }

        .wrap {
            display: flex;
            padding-top: 200px;
        }

        h2 {
            font-size: 30px;
            padding-top: 100px;
        }

        .box1 {
            background-color: lightblue;
            width: 500px;
            height: 100px;
            margin: 50px;
            border-radius: 30px;
        }

        .box2 {
            background-color: lightpink;
            width: 500px;
            height: 100px;
            margin: 50px;
            border-radius: 30px;
        }

        .box3 {
            background-color: lightsalmon;
            width: 500px;
            height: 100px;
            margin: 50px;
            border-radius: 30px;
        }
    </style>
</head>

<body>


    <h2>당신의 치아를 사랑하는 가장 감각적인 공간,LU치과</h2>
    <div class="wrap">
        <div class="box1">LU치과</div>
        <div class="box2">LU치과</div>
        <div class="box3">LU치과</div>
    </div>

    <script>
        gsap.timeline({
            scrollTrigger: {
                trigger: ".box2",
                start: "top 50%",
                scrub: 2,//스크롤의 영향을 다시 받도록
                markers: true
            }

        })
            .to(".box1", { y: -100, scale: 1.5, rotation: -20, duration: 1 })
            .to(".box2", { y: 100, scale: 1.5, rotation: 20, duration: 1.2 })
            .to(".box3", { y: -100, scale: 1.5, rotation: -20, duration: 1.4 })
    </script>
</body>

</html>
