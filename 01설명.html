<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: green;
            margin: 50px auto;
        }
    </style>
</head>

<body>
    <div class="box"></div>
    <script>
        gsap.from(".box", {
            y: 200,
            scale: 1.2,
            duration: 2,
            ease: "elastic.in"
        })
    </script>
</body>

</html>
<!--
gasp은 웹에서 부드럽고 성능 좋은 애니메이션을 쉽게 만들 수 있게 해주는 자바스크립트 라이브러리

-빠르고 부드러운 애니메이션을 지원
-다양한 브라우저와 호환
-코드가 간결하고 직관적임

gsap.to() /gsap.from() /gsap.fromTo() 등을 사용해서 애니메이션을 만듦

<easy종류 가속도종류>

ease :"power2.out"
ease :"elastic.in"
ease :"elastic.inOut"

.out : 빠르게 시작하고 천천히 끝남
.in :천천히 시작하고 빠르게 끝남
.inout :천천히 시작하고 천천히 끝남

power0 ~ power4 :숫자가 클수록 빠름
elastic :탄성처럼 튕기면서 애니메이션 진행
slow :부드럽게 시작하면서 움직임

<메서드 설명>
- gsap.to() :현재 상태에서 설정한 값으로 애니메이션 이동 (끝나는 상태)
- gsap.from() :설정한 값에서 시작해서 현재 상태로 끝남 (처음 상태 지정)
- gsap.fromTo() :시작값에서  끝값까지 지정(시작상태, 끝나는 상태를 지정)




-->
