<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: antiquewhite;
            margin-top: 300px;

        }
    </style>
</head>

<body>
    <div class="box"></div>
    <script>
        gsap.fromTo(".box",
            { x: 100, opacity: 0, scale: 0, backgroundColor: "#ccc" }, //시작지점
            { x: 500, opacity: 1, scale: 2, duration: 3 } //끝나는지점


        )
    </script>

</body>

</html>
