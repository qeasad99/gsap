<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: antiquewhite;
            margin-left: 300px;
            /*도착지점*/
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="box"></div>
    <script>
        gsap.from(".box", { //출발지점
            x: -300,
            scale: 0,
            opacity: 0,
            duration: 5,
            ease: "elastic.out"


        })
    </script>


</body>

</html>
