<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        ul {
            list-style: none;
        }

        .intro {
            display: flex;
            background-color: #ccc;
        }

        .left {
            width: 50%;
            height: 100vh;
            padding-top: 100px;
            text-align: center;

        }

        .right {
            width: 50%;
        }

        .right li {
            height: 600px;
            display: flex;
            font-size: 3rem;
            justify-content: center;
            align-items: center;
        }

        .right li:nth-of-type(1) {
            background-color: aliceblue;

        }

        .right li:nth-of-type(2) {
            background-color: lightcoral;
        }

        .right li:nth-of-type(3) {
            background-color: lightslategray;
        }

        .end {
            height: 500px;
            background-color: yellowgreen;
            color: #fff;
            text-align: center;
        }
    </style>
</head>

<body>
    <section class="intro">
        <div class="left">
            <h1>ABOUT US</h1>
            <P>우리들의 이야기를 소개합니다</P>

        </div>
        <ul class="right">
            <li>01</li>
            <li>02</li>
            <li>03</li>
        </ul>
    </section>
    <section class="end">
        <h2>contact</h2>

    </section>
    <script>
        gsap.to(".left", {
            scrollTrigger: {
                trigger: ".intro",
                start: "top top",
                end: "bottom bottom",
                pin: ".left",
                markers: true,
            }



        })
    </script>
</body>

</html>
