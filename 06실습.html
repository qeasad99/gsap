<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            background-color: tomato;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        h1 {
            font-size: 80px;
            opacity: 1;
        }

        p {
            margin-top: 20px;
            opacity: 1;
        }
    </style>
</head>

<body>
    <div>
        <h1>gsap</h1>
        <p>2026.10.30</p>
    </div>
    <script>

        gsap.from("h1", { //도착지점
            x: -300,
            opacity: 0,
            duration: 3,
            ease: "bounce.out"
        })
        gsap.from("p", { //도착지점
            y: 100,
            opacity: 0,
            duration: 2,
            delay: 2
        })


    </script>
</body>

</html>
