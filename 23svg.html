<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 200px;
            margin: 100px auto;
        }

        .cls-1 {
            fill: none;
            stroke: #45b649;
            stroke-miterlimit: 10;
            stroke-dasharray: 610;
            stroke-dashoffset: 610;
            animation: move 3s infinite linear;
        }

        @keyframes move {
            0% {
                stroke-dashoffset: 610;

            }

            100% {
                stroke-dashoffset: 0;
            }

        }
    </style>
</head>

<body>
    <div>
        <svg viewBox="0 0 177.38 211.65">
            <path class="cls-1" d="m.21,200.16S220.21,97.16,169.21,27.16s-111,20-111,20c0,0-35,141,82,164" />
        </svg>
    </div>
    <script>

        let paths = document.querySelectorAll("div .cls-1")

        console.log(paths);
        paths.forEach((path) => {
            let leng = path.getTotalLength();
            console.log(leng);
        })
    </script>



</body>

</html>
