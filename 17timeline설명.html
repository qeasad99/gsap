<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <style>
        div {
            width: 100px;
            height: 100px;
            margin: 30px;
        }

        .box1 {
            background-color: lightblue;
        }

        .box2 {
            background-color: lightpink;
        }

        .box3 {
            background-color: lightsalmon;
        }
    </style>
</head>


<body>
    <div class="box1">box1</div>
    <div class="box2">box2</div>
    <div class="box3">box3</div>
    <script>
        let t1 = gsap.timeline()
        t1.to(".box1", { x: 200, duration: 1 }, 1)
        t1.to(".box2", { x: 200, duration: 1 }, 1.2)
        t1.to(".box3", { rotation: 120, duration: 1 }, 1.4)
    </script>

</body>

</html>
<!--
gsap.timeline()은 여러 애니메이션을 순서대로 또는
동시에 움직임을 제어할 수 있는 기능
애니메이션을 시간 순서 또는 지연을 설정해서 순차적으로 움직임을 구현할 수 있음

순서대로 실행
let t1 =gsap.timeline()
t1.to(".box1",{실행문})
.to(".box2",{실행문})


0초에 동시에 실행
let t1 =gsap.timeline()
t1.to(".box1",{실행문})
.to(".box2",{실행문},0)

시간차를 두고 실행(box1은 0초에 실행되고 box2는 0.5초에 실행이됨)
0초에 동시에 실행
let t1 =gsap.timeline()
t1.to(".box1",{실행문},0)
.to(".box2",{실행문},0.5)









-->
