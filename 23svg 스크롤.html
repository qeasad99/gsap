<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <style>
        body {
            height: 2000px;
        }

        div {
            width: 200px;
            margin: 600px auto;
        }

        .cls-1 {
            fill: none;
            stroke: #45b649;
            stroke-miterlimit: 10;
            stroke-dasharray: 610;
            stroke-dashoffset: 610;
            /* animation: move 3s infinite linear; */
        }

        /* @keyframes move {
            0% {
                stroke-dashoffset: 610;

            }

            100% {
                stroke-dashoffset: 0;
            }

        } */
    </style>
</head>

<body>
    <div>
        <svg viewBox="0 0 177.38 211.65">
            <path class="cls-1" d="m.21,200.16S220.21,97.16,169.21,27.16s-111,20-111,20c0,0-35,141,82,164" />
        </svg>
    </div>
    <script>

        gsap.to(".cls-1", {
            strokeDashoffset: 0,
            scrollTrigger: {
                trigger: ".cls-1",
                start: "top 30%",
                end: "bottom 30%",

                scrub: 2,
                markers: true,
            }

        })
    </script>



</body>

</html>
