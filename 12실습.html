<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        body {
            height: 2000px;
        }

        .all {
            background-color: tomato;
            width: 100%;
            height: 100%;
        }

        .title h2 {
            font-size: 50px;
            text-align: center;
            padding: 100px;
        }

        .intro {
            width: 300px;
            background-color: #eee;
            padding: 20px;
            border-radius: 20px;
            opacity: 0;
            transform: translateX(-2000px);
        }
    </style>
</head>

<body>
    <div class="all">
        <div class="title">
            <h2>숏폼을 가장 잘 알고 <br>가장 잘 실행합니다</h2>
        </div>
        <section class="intro">
            <h2>마침내 다가온 숏폼의 시대</h2>
            <p>숏폼을 가장 잘 알고 가장 잘 실행합니다<br>
                오직 숏폼 마케팅만을 치열하게 고민해 왔기 때문입니다.</p>
        </section>
    </div>
    <script>
        gsap.to(".title", {
            scale: 1.2,

            duration: 4,
            opacity: 1,
            scrollTrigger: {
                trigger: ".title",
                start: "0% 0%", //0%는 top

                scrub: 1,
                markers: true,

            }

        })
        gsap.to(".intro", {
            x: 200,
            rotation: 360,
            duration: 4,
            opacity: 1,
            scrollTrigger: {
                trigger: ".intro",
                start: "0% 30%", //0%는 top
                end: "bottom 30%",
                scrub: 1,
                markers: true,

            }

        })
    </script>

</body>

</html>
